name: test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        shell: pwsh
        run: .\scripts\test.ps1
      - name: Validate plugin manifest
        shell: pwsh
        run: python .\scripts\validate_plugin.py .
