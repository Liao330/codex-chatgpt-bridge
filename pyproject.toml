[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-chatgpt-bridge"
version = "0.2.0"
description = "Codex orchestration for ChatGPT Web planning, read-only MCP inspection, review, and Deep Research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Local developer" }]
dependencies = []

[project.scripts]
ccw = "ccw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ccw"]
