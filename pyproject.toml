[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chicogong-codex-bridge"
version = "0.1.0"
description = "Review-only Codex orchestration for ChatGPT Web Pro and Deep Research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Local developer" }]
dependencies = []

[project.scripts]
ccw = "ccw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ccw"]
